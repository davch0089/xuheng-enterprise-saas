name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hengflow-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: hengflow-api/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q apps application core db scripts utils main.py
      - run: python -c "from main import create_app; assert create_app().openapi()['info']['title'] == 'HengFlow ERP API'"
        env:
          DEBUG: "true"
          REDIS_ENABLED: "false"
          DATABASE_URL: mysql+asyncmy://root:unused@127.0.0.1:3306/hengflow

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hengflow-admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: pnpm
          cache-dependency-path: hengflow-admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm vue-tsc --noEmit --skipLibCheck
      - run: pnpm vite build --mode pro
